<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Microsoft</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">
                <!-- Ganti SVG dengan gambar lokal -->
                <img src="bg micrgop.png" alt="Microsoft Logo" class="microsoft-logo">
                <span>Microsoft</span>
            </div>
            
            <h1>Masuk</h1>
            
            <form id="loginForm">
                <input type="text" id="username" placeholder="Alamat email, nomor telepon, atau Skype" required>
                
                <div class="links">
                    <a href="#">Belum punya akun? <strong>Buat sekarang!</strong></a>
                    <a href="#">Tidak dapat mengakses akun Anda?</a>
                </div>
                
                <div class="button-group">
                    <button type="button" class="btn-secondary" id="kembaliBtn">Kembali</button>
                    <button type="submit" class="btn-primary" id="selanjutnyaBtn">Selanjutnya</button>
                </div>
            </form>
        </div>
        
        <div class="sign-in-options">
            <p>
                <span class="icon-key">&#x1F511;</span> Opsi masuk
            </p>
        </div>
    </div>
    
    <footer>
        <a href="#">Ketentuan penggunaan</a>
        <a href="#">Privasi &amp; cookie</a>
        <span>...</span>
    </footer>

    <script src="login.js"></script>
</body>
</html>
